<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype Budget Trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: aplikasi web satu kolom (maks 980px) + panel simulasi di kanan pada layar lebar. Teal = aksi utama, oranye = sisa anggaran & peringatan. */
:root{
  --bg:#f4f8f8;
  --card:#ffffff;
  --ink:#132a2a;
  --muted:#5a6f6e;
  --line:#dbe7e5;
  --teal:#1fafa7;
  --teal-dk:#0c6a64;
  --teal-soft:#dcf2f0;
  --orange:#f7801f;
  --orange-dk:#b4530c;
  --orange-soft:#fdebdb;
  --red:#c2412d;
  --red-soft:#fbe6e2;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1717;--card:#142121;--ink:#e3eeed;--muted:#97acaa;--line:#253837;
  --teal:#2cc2b9;--teal-dk:#62d8d0;--teal-soft:#183a38;--orange:#ff8d33;--orange-dk:#ffac6a;--orange-soft:#3b2716;
  --red:#ff8a78;--red-soft:#3a1c18;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1717;--card:#142121;--ink:#e3eeed;--muted:#97acaa;--line:#253837;
  --teal:#2cc2b9;--teal-dk:#62d8d0;--teal-soft:#183a38;--orange:#ff8d33;--orange-dk:#ffac6a;--orange-soft:#3b2716;
  --red:#ff8a78;--red-soft:#3a1c18;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.shell{display:grid;grid-template-columns:minmax(0,980px) 260px;gap:28px;max-width:1300px;margin:0 auto;padding:0 20px 80px}
@media (max-width:1180px){.shell{grid-template-columns:minmax(0,1fr)}}
.top{display:flex;align-items:center;gap:12px;padding:18px 0 14px}
.top img{width:38px;height:38px}
.top .name{font-weight:800;font-size:18px;letter-spacing:-.01em}
.top .name b{color:var(--teal-dk)}
.top .sp{flex:1}
.top .lnk{font-size:14px;font-weight:600;color:var(--teal-dk);text-decoration:none;background:none;border:0;cursor:pointer}
.steps{display:flex;gap:6px;margin:0 0 18px;flex-wrap:wrap}
.steps span{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.steps span.on{background:var(--teal);border-color:var(--teal);color:#fff}
.steps span.done{color:var(--teal-dk);border-color:var(--teal-soft);background:var(--teal-soft)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
h1{font-size:clamp(26px,4vw,36px);line-height:1.15;letter-spacing:-.02em;margin:10px 0 8px;font-weight:800;text-wrap:balance}
h2{font-size:20px;margin:0 0 12px;font-weight:800;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 8px;font-weight:700}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--teal);color:#fff;text-decoration:none}
.btn:hover{filter:brightness(.95)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--teal-dk);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--teal-soft)}
.btn.full{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Beranda */
.hero{padding:18px 0 22px}
.ask{display:flex;gap:10px;margin:18px 0 8px}
.ask input{flex:1;min-width:0;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:16px}
.ask input:focus{border-color:var(--teal);outline:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:13px;padding:6px 12px;border-radius:99px;border:1px dashed var(--line);background:transparent;color:var(--muted);cursor:pointer}
.chip:hover{border-color:var(--teal);color:var(--teal-dk)}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:22px 0 14px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.form{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.f{display:flex;flex-direction:column;gap:6px}
.f.c2{grid-column:span 2}.f.c3{grid-column:span 3}.f.c6{grid-column:span 6}
@media (max-width:720px){.form{grid-template-columns:repeat(2,minmax(0,1fr))}.f.c2,.f.c3{grid-column:span 2}.f.c6{grid-column:span 2}.f.half{grid-column:span 1}}
.f label{font-size:13px;font-weight:700}
.f input,.f select{padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);width:100%}
.f input:focus,.f select:focus{border-color:var(--teal);outline:none}
.f .hint{font-size:12.5px;color:var(--muted)}
.f.filled input,.f.filled select{border-color:var(--teal);background:var(--teal-soft)}
.f.err input{border-color:var(--red)}
.f .errm{font-size:12.5px;color:var(--red);font-weight:600}
.money{position:relative}
.money span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600}
.money input{padding-left:38px;font-variant-numeric:tabular-nums}
.pax{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.step{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
.step button{border:0;background:none;width:34px;height:40px;font-size:18px;cursor:pointer;color:var(--teal-dk)}
.step b{flex:1;text-align:center;font-variant-numeric:tabular-nums}
.step small{display:block;font-size:11px;color:var(--muted);font-weight:600;text-align:center}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--teal-soft);color:var(--teal-dk);font-size:14px;margin:0 0 16px}
.banner.warn{background:var(--orange-soft);color:var(--orange-dk)}
.banner.bad{background:var(--red-soft);color:var(--red)}

/* Ringkasan pencarian */
.sum{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:14px;margin-bottom:16px}
.sum b{font-weight:700}
.sum .sp{flex:1}

/* Paket */
.pk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:900px){.pk{grid-template-columns:minmax(0,1fr)}}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.pcard.rec{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ph h3{font-size:18px;margin:0}
.tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--teal-soft);color:var(--teal-dk);white-space:nowrap}
.sisa{display:flex;flex-direction:column}
.sisa small{font-size:12px;font-weight:700;color:var(--orange-dk);text-transform:uppercase;letter-spacing:.05em}
.sisa b{font-size:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--orange-dk);line-height:1.2}
.meter{height:10px;border-radius:99px;background:var(--orange-soft);overflow:hidden;display:flex}
.meter i{display:block;background:var(--teal);height:100%}
.mtx{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:4px}
.item{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:4px;font-size:14px}
.item .k{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.item .k button{font-size:12.5px;text-transform:none;letter-spacing:0;color:var(--teal-dk);background:none;border:0;cursor:pointer;font-weight:700;padding:0}
.item .t{font-weight:700}
.item .s{color:var(--muted);font-size:13px}
.leg{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.flag{font-size:11.5px;font-weight:700;color:var(--orange-dk)}
.ok{color:var(--teal-dk);font-weight:600}
.price{display:flex;justify-content:space-between;font-size:14px;font-variant-numeric:tabular-nums}
.price.tot{font-weight:800;font-size:16px;border-top:1px solid var(--line);padding-top:8px}
.excl{font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 10px}

/* Lembar ganti pilihan */
.ov{position:fixed;inset:0;background:rgba(10,25,25,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:min(640px,100%);max-height:86%;overflow:auto;border-radius:16px 16px 0 0;padding:20px}
@media (min-width:720px){.ov{align-items:center}.sheet{border-radius:16px}}
.opt{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--card);text-align:left;width:100%;cursor:pointer}
.opt:hover{border-color:var(--teal)}
.opt.cur{border-color:var(--teal);background:var(--teal-soft);cursor:default}
.opt .r{text-align:right;font-variant-numeric:tabular-nums}
.d-up{color:var(--orange-dk);font-weight:700}
.d-dn{color:var(--teal-dk);font-weight:700}

/* Anggaran kurang */
.gap{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-variant-numeric:tabular-nums;font-size:15px;max-width:460px}
.gap .over{color:var(--red);font-weight:800}
.sug{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
@media (max-width:720px){.sug{grid-template-columns:minmax(0,1fr)}}
.sug .card{display:flex;flex-direction:column;gap:6px}
.sug .res{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}

/* Checkout */
.two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.paxcard{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.paxcard:first-of-type{border-top:0}
.paxcard .who{grid-column:span 4;font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center}
.paxcard .f.c2{grid-column:span 2}
@media (max-width:620px){.paxcard{grid-template-columns:minmax(0,1fr)}.paxcard .who,.paxcard .f.c2{grid-column:span 1}}
.pay{display:grid;gap:8px}
.pay label{display:flex;gap:10px;align-items:center;padding:12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer}
.pay input{accent-color:var(--teal)}
.pay label:has(input:checked){border-color:var(--teal);background:var(--teal-soft)}
.diff{display:grid;grid-template-columns:1fr auto;gap:4px 14px;font-variant-numeric:tabular-nums;margin:10px 0}
.diff s{color:var(--muted)}

/* Proses */
.proc{display:grid;gap:10px;max-width:460px}
.proc div{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.dot{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:800;border:2px solid var(--line)}
.dot.run{border-color:var(--teal);border-top-color:transparent;animation:sp 0.8s linear infinite}
.dot.ok{background:var(--teal);border-color:var(--teal);color:#fff}
.dot.no{background:var(--red);border-color:var(--red);color:#fff}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.dot.run{animation:none}}
.load{display:grid;place-items:center;gap:14px;padding:70px 0;text-align:center}
.load .dot{width:42px;height:42px;border-width:3px}

/* Perjalanan Saya */
.doc{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.doc .ic{width:40px;height:40px;border-radius:10px;background:var(--teal-soft);color:var(--teal-dk);display:grid;place-items:center;font-weight:800;font-size:12px}
.code{font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.06em}

/* Panel simulasi */
.demo{position:sticky;top:18px;align-self:start;margin-top:18px;background:var(--card);border:1px dashed var(--orange);border-radius:14px;padding:16px;font-size:13.5px}
.demo h3{display:flex;justify-content:space-between;align-items:center}
.demo label{display:flex;gap:8px;align-items:flex-start;margin:8px 0;cursor:pointer}
.demo input{accent-color:var(--orange);margin-top:3px}
.demo .btn{margin-top:6px}
.demo hr{border:0;border-top:1px solid var(--line);margin:12px 0}
@media (max-width:1180px){.demo{position:fixed;right:12px;bottom:12px;top:auto;width:270px;margin:0;z-index:15;box-shadow:0 8px 30px rgba(0,0,0,.15)}.demo.closed .body{display:none}}
.demo .tog{display:none;background:none;border:0;color:var(--orange-dk);font-weight:700;cursor:pointer}
@media (max-width:1180px){.demo .tog{display:inline}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:30}

/* ===== Kerangka aplikasi: sidebar di desktop, bar atas + tab bawah di ponsel ===== */
.layout{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;padding:20px 14px;border-right:1px solid var(--line);background:var(--card)}
.side .brandrow{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.side .brandrow img{width:36px;height:36px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14.5px}
.nav a:hover{background:var(--bg)}
.nav a[aria-current="page"]{background:var(--teal-soft);color:var(--teal-dk)}
.nav a .badge{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--orange);color:#fff;border-radius:99px;padding:0 7px}
.ico{width:20px;height:20px;flex:none}
.side .spacer{flex:1}
.who-mini{display:flex;align-items:center;gap:10px;padding:12px 8px;border-top:1px solid var(--line);margin-top:8px}
.av{width:36px;height:36px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.av.lg{width:64px;height:64px;font-size:22px}
.who-mini .t{min-width:0;font-size:13px;line-height:1.3}
.who-mini .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn:hover{border-color:var(--teal);color:var(--teal-dk)}
.main{min-width:0;padding:8px 28px 80px}
.content{display:grid;grid-template-columns:minmax(0,980px);gap:28px}
.content.withdemo{grid-template-columns:minmax(0,980px) 260px}
.mtop{display:none}
.tabs{display:none}
@media (max-width:1180px){.content.withdemo{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{padding:0 16px 96px}
  .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:12;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:12px}
  .mtop img{width:32px;height:32px}
  .mtop .sp{flex:1}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:14;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;padding:4px 0;border-radius:8px}
  .tabs a[aria-current="page"]{color:var(--teal-dk)}
  .tabs a[aria-current="page"] .ico{stroke-width:2.4}
  .demo{bottom:76px!important}
}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:22px 0 16px}
.pagehead h1{margin:0;font-size:clamp(24px,3.4vw,30px)}
.pagehead p{margin:4px 0 0}

/* ===== Pesanan & riwayat ===== */
.olist{display:grid;gap:12px}
.ocard{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-decoration:none;color:inherit}
a.ocard:hover{border-color:var(--teal)}
.odate{width:58px;text-align:center;border-radius:10px;background:var(--teal-soft);color:var(--teal-dk);padding:8px 0;line-height:1.1}
.odate b{display:block;font-size:22px;font-weight:800}
.odate span{font-size:11.5px;font-weight:700;text-transform:uppercase}
.ocard .meta2{font-size:13px;color:var(--muted)}
.ocard .r{text-align:right;font-variant-numeric:tabular-nums}
.st{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.st.up{background:var(--teal-soft);color:var(--teal-dk)}
.st.done{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.st.cx{background:var(--red-soft);color:var(--red)}
.st.part{background:var(--orange-soft);color:var(--orange-dk)}
@media (max-width:620px){.ocard{grid-template-columns:auto 1fr}.ocard .r{grid-column:1 / -1;text-align:left;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:10px}}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.yr{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.empty{text-align:center;padding:48px 16px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stats small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.stats b{font-size:20px;font-variant-numeric:tabular-nums}
@media (max-width:560px){.stats{grid-template-columns:1fr 1fr}.stats div:last-child{grid-column:span 2}}

/* ===== Profil & pengaturan ===== */
.prof{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.list{display:grid;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{flex:1;min-width:0}
.li .t small{display:block;color:var(--muted);font-size:13px}
.sec{margin:26px 0 10px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-grid;grid-auto-flow:column;gap:4px;padding:4px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.seg button{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
@media (max-width:520px){.seg{grid-auto-flow:row;width:100%}}
.sw{position:relative;width:44px;height:26px;flex:none}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .15s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw input:checked+span{background:var(--teal)}
.sw input:checked+span::after{transform:translateX(18px)}
.sw input:disabled{cursor:not-allowed}.sw input:disabled+span{opacity:.6}
.sw input:focus-visible+span{outline:2px solid var(--teal);outline-offset:2px}
.preview{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;max-width:420px}
.preview div{border-radius:10px;padding:10px;font-size:12px;font-weight:700;border:1px solid}
.addform{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:end;padding:14px 16px;border-top:1px solid var(--line);background:var(--bg)}
@media (max-width:700px){.addform{grid-template-columns:1fr 1fr}.addform .f:first-child{grid-column:span 2}}
.danger{color:var(--red)!important;border-color:var(--red-soft)!important}

/* ===== Landing ===== */
.lnav{position:sticky;top:0;z-index:12;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.lnav .in{display:flex;align-items:center;gap:20px;max-width:1160px;margin:0 auto;padding:12px 20px}
.lnav .links{display:flex;gap:4px;margin-left:18px}
.lnav .links a{color:var(--ink);text-decoration:none;font-weight:600;font-size:14.5px;padding:8px 12px;border-radius:8px}
.lnav .links a:hover{background:var(--card)}
.lnav .sp{flex:1}
.lnav .acts{display:flex;gap:8px;align-items:center}
.burger{display:none}
.mmenu{display:none}
@media (max-width:860px){
  .lnav .links,.lnav .acts .hide-m{display:none}
  .burger{display:grid}
  .mmenu.open{display:grid;gap:4px;padding:8px 20px 18px;border-top:1px solid var(--line);background:var(--bg)}
  .mmenu a{padding:12px 4px;font-weight:600;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
  .mmenu .btn{margin-top:10px}
}
.lwrap{max-width:1160px;margin:0 auto;padding:0 20px}
.lhero{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;padding:56px 0 64px}
@media (max-width:900px){.lhero{grid-template-columns:1fr;gap:32px;padding:32px 0 44px}}
.lhero h1{font-size:clamp(34px,5.4vw,58px);line-height:1.05;letter-spacing:-.03em;margin:0 0 18px}
.lhero h1 em{font-style:normal;color:var(--teal-dk)}
.lhero .lede{font-size:18px;color:var(--muted);max-width:52ch;margin:0 0 26px}
.lhero .ask input{font-size:16px}
.trust{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;font-size:13.5px;color:var(--muted)}
.trust span{display:flex;align-items:center;gap:6px}
.trust span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--teal)}
.demo-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 20px 50px -24px rgba(12,106,100,.35);display:grid;gap:14px;max-width:420px;justify-self:center;width:100%}
.demo-card .q{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px}
.demo-card .q small{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-bottom:2px}
.minis{display:grid;gap:8px}
.mini{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:13.5px}
.mini.on{border-color:var(--teal);background:var(--teal-soft)}
.mini b{font-size:14px}
.mini .bar{height:6px;border-radius:99px;background:var(--orange-soft);overflow:hidden}
.mini .bar i{display:block;height:100%;background:var(--teal)}
.mini .v{font-variant-numeric:tabular-nums;font-weight:700;color:var(--orange-dk);font-size:13px;text-align:right}
.band{padding:64px 0;border-top:1px solid var(--line)}
.band.alt{background:var(--card)}
.band h2{font-size:clamp(24px,3.4vw,34px);letter-spacing:-.02em;margin:0 0 10px;max-width:24ch}
.band .intro{color:var(--muted);max-width:60ch;margin:0 0 32px;font-size:16.5px}
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;counter-reset:h}
@media (max-width:900px){.how{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.how{grid-template-columns:1fr}}
.how div{counter-increment:h;border-top:2px solid var(--teal);padding-top:14px}
.how div::before{content:"0" counter(h);font-weight:800;color:var(--teal-dk);font-size:13px;display:block;margin-bottom:6px}
.how b{display:block;font-size:16px;margin-bottom:4px}
.how p{color:var(--muted);font-size:14.5px}
.pks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:860px){.pks{grid-template-columns:1fr}}
.pks .card{display:grid;gap:8px}
.pks .pct{font-size:13px;font-weight:700;color:var(--teal-dk)}
.pks .ex{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;font-size:14px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.pks .ex b{color:var(--orange-dk)}
.incl{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:700px){.incl{grid-template-columns:1fr}}
.incl ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.incl li{display:flex;gap:10px;align-items:flex-start;font-size:15px;margin:0}
.incl li::before{content:"✓";font-weight:800;color:var(--teal-dk)}
.incl .no li::before{content:"–";color:var(--muted)}
.dests{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:900px){.dests{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dest{border-radius:14px;padding:18px;min-height:120px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;font-weight:800;font-size:18px;position:relative;overflow:hidden;cursor:pointer;border:0;text-align:left}
.dest small{font-weight:600;font-size:12.5px;opacity:.9}
.faq details{border-bottom:1px solid var(--line);padding:16px 0}
.faq summary{font-weight:700;cursor:pointer;font-size:16px}
.faq p{color:var(--muted);margin:10px 0 0;max-width:70ch}
.lfoot{padding:36px 0 48px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted)}
.lfoot .in{display:flex;gap:20px;justify-content:space-between;flex-wrap:wrap;align-items:center}

/* ===== Login ===== */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
@media (max-width:860px){.auth{grid-template-columns:1fr}.auth .aside{display:none}}
.auth .aside{background:var(--teal-dk);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
:root[data-theme="dark"] .auth .aside{background:#0f3d3a}
.auth .aside h2{font-size:32px;letter-spacing:-.02em;line-height:1.15;max-width:16ch;margin:0 0 12px}
.auth .aside p{opacity:.85;max-width:40ch}
.auth .aside .mini{border-color:rgba(255,255,255,.25);color:#fff}
.auth .aside .mini .v{color:#ffd2ad}
.auth .aside .mini .bar{background:rgba(255,255,255,.2)}
.auth .aside .mini .bar i{background:#fff}
.auth .formside{display:flex;flex-direction:column;padding:24px;}
.auth .box{width:100%;max-width:400px;margin:auto;display:grid;gap:14px}
.tabsw{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.tabsw button{border:0;background:none;padding:9px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--muted)}
.tabsw button[aria-pressed="true"]{background:var(--teal);color:#fff}
.oauth{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:700;cursor:pointer}
.oauth:hover{border-color:var(--teal)}
.pw{position:relative}.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--teal-dk);font-weight:700;font-size:13px;cursor:pointer}


/* ===== Landing v2: satu momen utama (struk anggaran yang hidup), sisanya tenang ===== */
:root{--display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif}
.lp h1,.lp h2,.lp .disp{font-family:var(--display);font-optical-sizing:auto}
.lp-hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:56px;align-items:center;padding:48px 0 72px}
@media (max-width:940px){.lp-hero{grid-template-columns:minmax(0,1fr);gap:36px;padding:28px 0 52px}}
.lp-hero h1{font-size:clamp(40px,6.4vw,76px);line-height:.98;letter-spacing:-.035em;font-weight:800;margin:0 0 22px;text-wrap:balance}
.lp-hero h1 .u{color:var(--teal-dk);position:relative;white-space:nowrap}
.lp-hero h1 .u::after{content:"";position:absolute;left:0;right:0;bottom:.04em;height:.12em;background:var(--orange);border-radius:2px;transform-origin:left;animation:lpline .9s .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes lpline{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.lp-hero .lede{font-size:18.5px;line-height:1.6;color:var(--muted);max-width:46ch;margin:0 0 26px}
.lp-ask{display:flex;gap:8px;padding:6px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);box-shadow:0 10px 30px -18px rgba(12,106,100,.45);transition:border-color .15s}
.lp-ask:focus-within{border-color:var(--teal)}
.lp-ask input{flex:1;min-width:0;border:0;background:transparent;padding:12px 12px;font-size:16px;outline:none}
.lp-try{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0;align-items:center}
.lp-try span{font-size:13px;color:var(--muted);font-weight:600}
.lp-try button{font-size:13px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink);transition:border-color .15s,transform .15s}
.lp-try button:hover{border-color:var(--teal);transform:translateY(-1px)}
.lp-note{font-size:13px;color:var(--muted);margin-top:16px}

/* struk */
.rcpt{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 22px 18px;box-shadow:0 30px 60px -30px rgba(12,106,100,.45);max-width:460px;width:100%;justify-self:center}
.rcpt::before,.rcpt::after{content:"";position:absolute;left:18px;right:18px;height:10px;background:radial-gradient(circle at 5px 5px,var(--bg) 4px,transparent 4.5px) 0 0/14px 10px repeat-x}
.rcpt::before{top:-5px}.rcpt::after{bottom:-5px}
.rhead{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.rhead .live{display:flex;align-items:center;gap:6px;color:var(--teal-dk)}
.rhead .live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--teal);animation:lppulse 1.6s infinite}
@keyframes lppulse{50%{opacity:.25}}
.rq{min-height:52px;padding:12px 14px;border-radius:12px;background:var(--bg);font-size:15px;line-height:1.45}
.rq .caret{display:inline-block;width:2px;height:1.05em;background:var(--teal);vertical-align:-2px;margin-left:1px;animation:lpblink 1s steps(1) infinite}
@keyframes lpblink{50%{opacity:0}}
.rchips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 16px;min-height:62px;align-content:flex-start}
.rchip{font-size:12.5px;padding:4px 10px;border-radius:8px;border:1px dashed var(--line);color:var(--muted);transition:all .25s}
.rchip b{font-weight:700;margin-left:4px}
.rchip.on{border-style:solid;border-color:var(--teal);background:var(--teal-soft);color:var(--teal-dk);animation:lppop .3s}
@keyframes lppop{40%{transform:scale(1.07)}}
.rtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:10px;background:var(--bg);margin-bottom:14px}
.rtabs span{text-align:center;font-size:12.5px;font-weight:700;padding:6px 0;border-radius:7px;color:var(--muted);transition:all .25s}
.rtabs span.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.rbar{display:flex;height:14px;border-radius:99px;background:var(--orange-soft);overflow:hidden}
.rbar i{display:block;height:100%;transition:width .7s cubic-bezier(.2,.8,.2,1);width:0}
.rbar .f{background:var(--teal-dk)}.rbar .h{background:var(--teal)}
.rleg{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin:8px 0 12px}
.rleg span{display:flex;align-items:center;gap:5px}.rleg span::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.rrow{display:flex;white-space:nowrap;align-items:baseline;gap:8px;font-size:14.5px;padding:3px 0;font-variant-numeric:tabular-nums}
.rrow .dots{flex:1;border-bottom:1.5px dotted var(--line);transform:translateY(-4px)}
.rrow.rsisa{border-top:1.5px dashed var(--line);margin-top:8px;padding-top:10px;font-weight:800}
.rrow.rsisa span:first-child{color:var(--ink)}
.rrow.rsisa b{font-family:var(--display);font-size:26px;color:var(--orange-dk);letter-spacing:-.02em}
.rfoot{font-size:12px;color:var(--muted);margin-top:6px}

/* bagian */
.lp-sec{padding:84px 0;border-top:1px solid var(--line)}
.lp-sec.tint{background:var(--card)}
.lp-sec h2{font-size:clamp(28px,4vw,44px);line-height:1.05;letter-spacing:-.03em;margin:0 0 12px;max-width:20ch;text-wrap:balance}
.lp-sec .sub{color:var(--muted);font-size:17px;max-width:56ch;margin:0 0 36px}
@media (max-width:700px){.lp-sec{padding:56px 0}}

/* penggeser */
.sl-wrap{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:40px;align-items:start}
@media (max-width:900px){.sl-wrap{grid-template-columns:minmax(0,1fr);gap:24px}}
.sl-val{font-family:var(--display);font-size:clamp(40px,5vw,60px);font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.sl-val small{display:block;font-family:var(--font);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
input[type=range].sl{width:100%;margin:22px 0 6px;-webkit-appearance:none;appearance:none;height:8px;border-radius:99px;background:linear-gradient(to right,var(--teal) var(--p,50%),var(--line) var(--p,50%));outline:none}
input[type=range].sl::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--card);border:3px solid var(--teal);cursor:grab;box-shadow:0 2px 8px rgba(0,0,0,.2)}
input[type=range].sl::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--card);border:3px solid var(--teal);cursor:grab}
input[type=range].sl:focus-visible::-webkit-slider-thumb{outline:3px solid var(--orange);outline-offset:2px}
.sl-scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sl-ctx{margin-top:18px;font-size:14px;color:var(--muted)}
.sl-cards{display:grid;gap:10px}
.slc{display:grid;grid-template-columns:110px minmax(0,1fr) 130px;gap:16px;align-items:center;padding:16px 18px;border-radius:14px;border:1px solid var(--line);background:var(--bg);transition:border-color .2s,opacity .2s}
.lp-sec.tint .slc{background:var(--bg)}
.slc.off{opacity:.45}
.slc b.n{font-family:var(--display);font-size:20px;letter-spacing:-.01em}
.slc .what{font-size:13px;color:var(--muted);line-height:1.35}
.slc .bar{height:8px;border-radius:99px;background:var(--orange-soft);overflow:hidden;margin-top:6px}
.slc .bar i{display:block;height:100%;background:var(--teal);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.slc .r{text-align:right;font-variant-numeric:tabular-nums}
.slc .r small{display:block;font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.slc .r b{font-size:18px;color:var(--orange-dk)}
@media (max-width:560px){.slc{grid-template-columns:minmax(0,1fr) auto}.slc .mid{grid-column:1/-1;order:3}}
.sl-short{padding:14px 16px;border-radius:12px;background:var(--red-soft);color:var(--red);font-weight:600;font-size:14.5px}

/* langkah */
.lp-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;counter-reset:s;position:relative}
@media (max-width:900px){.lp-steps{grid-template-columns:minmax(0,1fr)}}
.lp-steps li{list-style:none;counter-increment:s;padding:0 22px 0 0;position:relative}
.lp-steps li::before{content:counter(s);display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--teal-soft);color:var(--teal-dk);font-family:var(--display);font-weight:800;font-size:18px;margin-bottom:16px;position:relative;z-index:1;transition:background .2s,color .2s}
.lp-steps li:hover::before{background:var(--teal);color:#fff}
.lp-steps li::after{content:"";position:absolute;top:22px;left:44px;right:0;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 12px)}
.lp-steps li:last-child::after{display:none}
@media (max-width:900px){.lp-steps li{padding:0 0 26px 64px}.lp-steps li::before{position:absolute;left:0;top:0}.lp-steps li::after{top:48px;bottom:4px;left:21px;right:auto;width:2px;height:auto;background:repeating-linear-gradient(180deg,var(--line) 0 6px,transparent 6px 12px)}}
.lp-steps b{display:block;font-size:17px;margin-bottom:6px}
.lp-steps p{color:var(--muted);font-size:15px;margin:0}
.lp-steps ol{padding:0;margin:0}

/* hitungan */
.lp-count{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:16px;overflow:hidden}
@media (max-width:700px){.lp-count{grid-template-columns:1fr}}
.lp-count>div{padding:26px}
.lp-count>div+div{border-left:1px solid var(--line);background:var(--bg)}
@media (max-width:700px){.lp-count>div+div{border-left:0;border-top:1px solid var(--line)}}
.lp-count h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
.lp-count ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.lp-count li{display:flex;gap:12px;font-size:16px;margin:0;align-items:center}
.lp-count li i{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px;flex:none}
.lp-count .y i{background:var(--teal-soft);color:var(--teal-dk)}
.lp-count .n i{background:var(--line);color:var(--muted)}

/* tujuan */
.lp-dest{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:940px){.lp-dest{grid-template-columns:repeat(2,minmax(0,1fr))}.lp-dest button:first-child{grid-column:span 2}}
.lp-dest button{position:relative;min-height:170px;border:0;border-radius:16px;padding:18px;text-align:left;color:#fff;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.lp-dest button:hover{transform:translateY(-4px);box-shadow:0 16px 30px -16px rgba(0,0,0,.45)}
.lp-dest .nm{font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1}
.lp-dest .fr{font-size:12.5px;opacity:.9}
.lp-dest .fr b{display:block;font-size:17px;opacity:1}
.lp-dest .go{position:absolute;right:16px;top:16px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;transition:transform .25s,background .25s}
.lp-dest button:hover .go{transform:rotate(-45deg);background:rgba(255,255,255,.35)}
.lp-dest svg.topo{position:absolute;inset:0;width:100%;height:100%;opacity:.18;pointer-events:none}

/* CTA akhir */
.lp-end{background:var(--teal-dk);color:#fff;padding:80px 0;text-align:left}
:root[data-theme="dark"] .lp-end{background:#0f3d3a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lp-end{background:#0f3d3a}}
.lp-end h2{font-family:var(--display);font-size:clamp(30px,4.6vw,52px);letter-spacing:-.03em;line-height:1.02;margin:0 0 14px;max-width:16ch}
.lp-end p{opacity:.85;max-width:50ch;margin:0 0 26px;font-size:17px}
.lp-end .lp-ask{max-width:620px;border-color:transparent}
.lp-end .lp-ask input{color:var(--ink)}

@media (prefers-reduced-motion:reduce){
  .lp *,.lp *::before,.lp *::after{animation:none!important;transition:none!important}
}

.tk-band .cr{color:var(--ink);font-size:14px;text-transform:none;letter-spacing:0}
.tk-rt{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.tk-rt .pt b{display:block;font-family:"Bricolage Grotesque","Plus Jakarta Sans",sans-serif;font-size:40px;line-height:1;letter-spacing:-.02em}
.tk-rt .pt span{display:block;font-size:12px;color:var(--mu);max-width:150px}
.tk-rt .pt.b{text-align:right}.tk-rt .pt.b span{margin-left:auto}
.tk-rt .ln{position:relative;height:2px;background:repeating-linear-gradient(90deg,var(--ln) 0 6px,transparent 6px 11px)}
.tk-rt .ln i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;padding:0 8px;color:var(--o);font-style:normal;font-size:12px;font-weight:700;white-space:nowrap}
.tk-tm{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px;padding-top:14px;border-top:1px solid var(--ln)}
.tk-tm small{display:block;font-size:10px;color:var(--mu);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.tk-tm b{font-size:18px;font-variant-numeric:tabular-nums}
.tk-tm b.hl{color:var(--td)}
.tk h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:24px 0 8px}
.tk table{width:100%;border-collapse:collapse;font-size:13px}
.tk th{text-align:left;font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;background:var(--bg)}
.tk td{padding:10px;border-bottom:1px solid var(--ln)}
.tk td.n{font-variant-numeric:tabular-nums}
.tk-two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px}
.tk-box{border:1px solid var(--ln);border-radius:12px;padding:14px 16px}
.tk-box.warn{background:var(--os);border-color:transparent}
.tk-box ol,.tk-box ul{margin:0;padding-left:18px;display:grid;gap:5px}
.tk-box b.t{display:block;margin-bottom:6px}
.tk-bud{display:flex;align-items:center;gap:14px;margin-top:22px;padding:14px 16px;border-radius:12px;background:var(--bg)}
.tk-bud .bar{flex:1;height:8px;border-radius:99px;background:var(--os);overflow:hidden;display:flex}
.tk-bud .bar i{display:block;height:100%;background:var(--t)}
.tk-bud span{font-size:12px;color:var(--mu)}.tk-bud b{color:var(--od)}
.tk-ft{position:absolute;left:48px;right:48px;bottom:32px;display:flex;justify-content:space-between;font-size:10.5px;color:var(--mu);border-top:1px solid var(--ln);padding-top:10px}
.tk-hotel{border:1.5px solid var(--ln);border-radius:16px;overflow:hidden}
.tk-hotel .top{background:linear-gradient(150deg,var(--td),var(--t));color:#fff;padding:20px 22px;display:flex;justify-content:space-between;gap:16px;align-items:flex-end}
.tk-hotel .top b{font-family:"Bricolage Grotesque","Plus Jakarta Sans",sans-serif;font-size:28px;line-height:1.05;letter-spacing:-.02em;display:block}
.tk-hotel .top small{opacity:.85}
.tk-hotel .stars{color:#ffd2ad;letter-spacing:2px;font-size:14px}
.tk-hotel .ci{display:grid;grid-template-columns:1fr auto 1fr auto;gap:16px;align-items:center;padding:18px 22px}
.tk-hotel .ci small{display:block;font-size:10px;color:var(--mu);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.tk-hotel .ci b{font-size:18px;display:block}.tk-hotel .ci span{font-size:12px;color:var(--mu);display:block}
.tk-hotel .nt{display:grid;place-items:center;width:72px;height:72px;border-radius:50%;background:var(--ts);color:var(--td);text-align:center;line-height:1}
.tk-hotel .nt b{font-family:"Bricolage Grotesque","Plus Jakarta Sans",sans-serif;font-size:26px}
.tk-hotel .nt span{font-size:10px;font-weight:700;color:var(--td)}
.tk-sample{position:absolute;left:48px;right:48px;bottom:58px;text-align:center;font-size:10.5px;font-weight:700;color:var(--od);background:var(--os);border-radius:8px;padding:6px}

/* penampil e-tiket */
.tkov{position:fixed;inset:0;z-index:40;background:rgba(8,22,22,.6);backdrop-filter:blur(4px);display:flex;flex-direction:column;animation:ldin .2s}
.tkbar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.tkbar .seg{margin-right:auto;grid-auto-flow:column!important;width:auto!important}
@media (max-width:520px){.tkbar .seg button{padding:7px 9px;font-size:12.5px}}
.tkscroll{flex:1;overflow:auto;padding:24px 16px 40px;display:flex;justify-content:center}
.tkfit{transform-origin:top left;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);border-radius:6px;overflow:hidden;animation:tkin .35s cubic-bezier(.2,.8,.2,1)}
@keyframes tkin{from{transform:translateY(16px) scale(var(--s));opacity:0}}
@media (prefers-reduced-motion:reduce){.tkfit{animation:none}}

/* ===== Kotak akun di menu ===== */
.ubox{position:relative;margin-top:10px;border-top:1px solid var(--line);padding-top:12px}
.ubtn{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border:1px solid transparent;border-radius:12px;background:transparent;cursor:pointer;text-align:left;transition:background .15s,border-color .15s}
.ubtn:hover,.ubtn[aria-expanded="true"]{background:var(--bg);border-color:var(--line)}
.ubtn .t{flex:1;min-width:0;line-height:1.3}
.ubtn .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ubtn .t span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ubtn .chev{color:var(--muted);transition:transform .2s;flex:none}
.ubtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.umenu{position:absolute;left:0;right:0;bottom:calc(100% + 8px);z-index:30;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px -14px rgba(0,0,0,.35);padding:6px;display:grid;gap:2px;animation:umin .18s ease-out;min-width:230px}
@keyframes umin{from{opacity:0;transform:translateY(6px)}}
.umenu .hd{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;line-height:1.3}
.umenu .hd b{display:block;font-size:14px}.umenu .hd span{font-size:12.5px;color:var(--muted);word-break:break-all}
.umenu button,.umenu a{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:9px;background:transparent;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;cursor:pointer;text-align:left}
.umenu button:hover,.umenu a:hover{background:var(--bg)}
.umenu .ico{width:18px;height:18px;color:var(--muted)}
.umenu .sep{height:1px;background:var(--line);margin:4px 2px}
.umenu .tg{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted)}
.umenu .out{color:var(--red)}.umenu .out .ico{color:var(--red)}
.um-m{position:relative}
.um-m .umenu{bottom:auto;top:calc(100% + 8px);left:auto;right:0;width:250px}
@media (prefers-reduced-motion:reduce){.umenu{animation:none}}

/* ===== Layar proses pesanan (layar penuh) ===== */
.pz{position:fixed;inset:0;z-index:45;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(1200px 600px at 50% 40%,var(--teal-soft),var(--bg) 70%);animation:ldin .3s}
.pz-cloud{position:absolute;height:60px;border-radius:99px;background:var(--card);opacity:.55;filter:blur(1px);animation:cloud linear infinite}
.pz-cloud::before,.pz-cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.pz-cloud::before{width:70px;height:70px;left:30px;top:-35px}.pz-cloud::after{width:50px;height:50px;left:90px;top:-22px}
.pz-cloud.c1{width:180px;top:16%;animation-duration:38s;animation-delay:-8s}
.pz-cloud.c2{width:240px;top:58%;animation-duration:52s;animation-delay:-30s;opacity:.4}
.pz-cloud.c3{width:150px;top:78%;animation-duration:44s;animation-delay:-18s;opacity:.35}
@keyframes cloud{from{transform:translateX(-300px)}to{transform:translateX(110vw)}}
.pz-top{position:relative;display:flex;align-items:center;gap:12px;padding:18px clamp(16px,3vw,40px)}
.pz-top img{width:40px;height:40px}
.pz-top b{display:block;font-size:16px}.pz-top small{font-size:12.5px;color:var(--muted)}
.pz-keep{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--orange-dk);background:var(--orange-soft);padding:6px 12px;border-radius:99px}
.pz-mid{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(18px,3vh,34px);width:min(1100px,100%);margin:0 auto;padding:0 clamp(16px,3vw,40px)}
.pz-route{display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:clamp(10px,2vw,28px)}
.pz-pt b{display:block;font-family:var(--display);font-size:clamp(40px,7vw,84px);line-height:.9;letter-spacing:-.03em}
.pz-pt span{display:block;font-weight:700;font-size:15px;margin-top:6px}
.pz-pt small{display:block;font-size:12.5px;color:var(--muted)}
.pz-pt.r{text-align:right}
.pz-arc{position:relative;height:clamp(90px,16vh,160px);margin-bottom:22px}
.pz-arc>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.pz-plane svg{display:block}
.pz-arc>svg path{fill:none;stroke-width:3;vector-effect:non-scaling-stroke}
.pz-arc path.bg{stroke:var(--line);stroke-dasharray:6 8}
.pz-arc path.fg{stroke:var(--teal);stroke-dasharray:1000;stroke-dashoffset:1000;animation:arcdraw 4.6s ease-in-out infinite}
@keyframes arcdraw{0%{stroke-dashoffset:1000}75%,100%{stroke-dashoffset:0}}
.pz-arc circle.a{fill:var(--teal)}.pz-arc circle.b{fill:var(--orange)}
.pz-plane{position:absolute;left:0;top:0;width:30px;height:30px;color:var(--orange-dk);offset-path:var(--op);offset-rotate:auto;animation:pzfly 4.6s ease-in-out infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
@keyframes pzfly{0%{offset-distance:0%;opacity:0}6%{opacity:1}75%{offset-distance:100%;opacity:1}85%,100%{offset-distance:100%;opacity:0}}
.pz-pct{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.pz-pct b{font-family:var(--display);font-size:clamp(48px,8vw,96px);line-height:.9;letter-spacing:-.04em;color:var(--teal-dk);font-variant-numeric:tabular-nums}
.pz-pct span#pz-now{font-size:17px;font-weight:700;color:var(--muted)}
.pz-track{height:10px;border-radius:99px;background:var(--orange-soft);overflow:hidden}
.pz-track i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--teal-dk),var(--teal));transition:width .6s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.pz-track i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shimmer 1.2s linear infinite}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.pz-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:820px){.pz-steps{grid-template-columns:1fr 1fr}}
.pz-step{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);margin:0;transition:border-color .3s,transform .3s,opacity .3s;opacity:.6}
.pz-step.run{opacity:1;border-color:var(--teal);transform:translateY(-3px);box-shadow:0 12px 26px -16px rgba(12,106,100,.6)}
.pz-step.ok{opacity:1}
.pz-step.no{opacity:1;border-color:var(--red)}
.pz-step .tx{min-width:0;line-height:1.3}.pz-step .tx b{display:block;font-size:14px}.pz-step .tx small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pz-ic{position:relative;width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--bg);color:var(--muted);transition:background .3s,color .3s}
.pz-ic .ico{width:20px;height:20px;transition:opacity .2s,transform .3s}
.pz-ic .ck,.pz-ic .x{position:absolute;opacity:0}
.pz-ic .ck{width:22px;height:22px}.pz-ic .ck path{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24}
.pz-step.run .pz-ic{background:var(--teal-soft);color:var(--teal-dk)}
.pz-step.run .pz-ic::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2.5px solid var(--teal);border-top-color:transparent;animation:ldspin .9s linear infinite}
.pz-step.ok .pz-ic{background:var(--teal)}
.pz-step.ok .pz-ic .ico{opacity:0;transform:scale(.4)}
.pz-step.ok .pz-ic .ck{opacity:1}.pz-step.ok .pz-ic .ck path{animation:ckdraw .4s .05s forwards}
@keyframes ckdraw{to{stroke-dashoffset:0}}
.pz-step.no .pz-ic{background:var(--red);color:#fff}.pz-step.no .pz-ic .ico{opacity:0}.pz-step.no .pz-ic .x{opacity:1;font-weight:900}
.pz-ok{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;text-align:center;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .4s}
.pz-ok svg{width:110px;height:110px}
.pz-ok circle{fill:var(--teal);transform-origin:center;transform:scale(0)}
.pz-ok path{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60}
.pz-ok b{font-family:var(--display);font-size:clamp(28px,4vw,40px);letter-spacing:-.02em}
.pz-ok span{color:var(--muted)}
.pz.done .pz-ok{opacity:1}
.pz.done .pz-ok circle{animation:okpop .5s cubic-bezier(.3,1.5,.5,1) forwards}
.pz.done .pz-ok path{animation:ckdraw .45s .35s forwards}
@keyframes okpop{to{transform:scale(1)}}
.pz-foot{position:relative;display:flex;justify-content:center;gap:28px;flex-wrap:wrap;padding:16px;font-size:14px;color:var(--muted);border-top:1px solid var(--line);background:color-mix(in srgb,var(--card) 80%,transparent)}
.pz-foot b{color:var(--ink);font-variant-numeric:tabular-nums}.pz-foot b.o{color:var(--orange-dk)}
@media (max-width:620px){.pz-keep{display:none}.pz-route{grid-template-columns:1fr 1fr}.pz-arc{grid-column:1/-1;grid-row:1;margin:0}.pz-steps{grid-template-columns:1fr;gap:8px}.pz-step{padding:10px 12px}}
@media (prefers-reduced-motion:reduce){.pz *,.pz{animation:none!important;transition:none!important}.pz-arc path.fg{stroke-dashoffset:0}.pz-plane{display:none}.pz-ok circle{transform:none}.pz-ok path,.pz-step .ck path{stroke-dashoffset:0}}
</style>

function rng(seed){let h=2166136261;for(const c of seed)h=Math.imul(h^c.charCodeAt(0),16777619);return()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}

function roomsFor(p){return Math.max(1,Math.ceil((p.adults+p.children)/2))}
function roomText(p){const n=p.adults+p.children,k=roomsFor(p);if(k===1)return`1 kamar, isi ${n} orang`;const a=Math.ceil(n/k);const rest=n-a*(k-1);return k+" kamar, isi "+(rest===a?a+" orang per kamar":Array(k-1).fill(a).concat(rest).join(", ")+" orang")}
function flightCost(f,p){return f.pp*(p.adults+p.children)+Math.round(f.pp*.1)*p.infants}
function hotelCost(h,p){return h.ppn*nightsOf(p.start,p.end)*roomsFor(p)}
function scoreF(f){return f.score+(f.lateArr?-1.5:0)+(f.dep<6?-.4:0)}
function scoreH(h){return h.stars*.6+(h.rating-7)*1.2+Math.log10(h.reviews)*.3-h.dist*.15+(h.cancel?.5:0)}

function search(p,opt={}){
  const flights=genFlights(p,opt.darat),hotels=genHotels(p),rooms=roomsFor(p);
  const fs=flights.filter(f=>flightCost(f,p)<=p.budget).sort((a,b)=>flightCost(a,p)-flightCost(b,p)).slice(0,30);
  const hs=hotels.filter(h=>h.avail>=rooms&&hotelCost(h,p)<=p.budget).sort((a,b)=>hotelCost(a,p)-hotelCost(b,p)).slice(0,50);
  const combos=[];
  fs.forEach(f=>hs.forEach(h=>{
    if(f.lateArr&&!h.late)return;
    const total=flightCost(f,p)+hotelCost(h,p);
    combos.push({f,h,total,ratio:total/p.budget,score:scoreF(f)+scoreH(h)});
  }));
  const fit=combos.filter(c=>c.total<=p.budget);
  const all=[];flights.forEach(f=>hotels.forEach(h=>{if(h.avail>=rooms)all.push({f,h,total:flightCost(f,p)+hotelCost(h,p)})}));
  all.sort((a,b)=>a.total-b.total);
  const cheapest=all[0];
  if(!cheapest)return{ok:false,flights,hotels,cheapest:null,noroute:true};
  if(!fit.length)return{ok:false,flights,hotels,cheapest};
  const used={f:new Set(),h:new Set()},pkgs=[];
  const sortedByPrice=[...fit].sort((a,b)=>a.total-b.total);
  BANDS.forEach((b,i)=>{
    let pool=fit.filter(c=>c.ratio>=b.lo&&c.ratio<=b.hi);
    let fresh=pool.filter(c=>!used.h.has(c.h.id)&&!used.f.has(c.f.id));
    if(!fresh.length)fresh=pool.filter(c=>!used.h.has(c.h.id));
    if(!fresh.length){const n=sortedByPrice.length,third=sortedByPrice.slice(Math.floor(n*i/3),Math.max(Math.floor(n*(i+1)/3),Math.floor(n*i/3)+1));fresh=third.filter(c=>!used.h.has(c.h.id));if(!fresh.length)fresh=third}
    if(!fresh.length)return;
    fresh.sort((a,c)=>c.score-a.score);
    const c=fresh[0];used.h.add(c.h.id);used.f.add(c.f.id);
    pkgs.push({band:b,f:c.f,h:c.h});
  });
  return{ok:true,pkgs,flights:fs,hotels:hs,cheapest};
}

/* ---------- pembaca kalimat ---------- */
const MONTHS=["januari","februari","maret","april","mei","juni","juli","agustus","september","oktober","november","desember"];
const MSHORT=["jan","feb","mar","apr","mei","jun","jul","agu","sep","okt","nov","des"];
const NUMW={sendiri:1,sendirian:1,berdua:2,bertiga:3,berempat:4,berlima:5};
function parseSentence(s){
  const t=" "+s.toLowerCase().replace(/,/g," ")+" ",out={},filled=[];
  const hits=findCities(t);
  hits.forEach(h=>{if(/dari\s*$/.test(h.before)&&!out.origin)out.origin=h.k;else if(/(ke|menuju|tujuan|liburan di|ke kota)\s*$/.test(h.before)&&!out.dest)out.dest=h.k});
  hits.forEach(h=>{if(out.origin===h.k||out.dest===h.k)return;if(!out.dest)out.dest=h.k;else if(!out.origin)out.origin=h.k});
  let mi=-1;MONTHS.forEach((m,i)=>{if(t.includes(m))mi=i});
  if(mi<0)MSHORT.forEach((m,i)=>{if(new RegExp("\\s"+m+"\\s").test(t))mi=i});
  if(mi>=0){
    let day=1;const dm=t.match(/(\d{1,2})\s+(?:[a-z]+\s)?(?:januari|februari|maret|april|mei|juni|juli|agustus|september|oktober|november|desember|jan|feb|mar|apr|jun|jul|agu|sep|okt|nov|des)/);
    if(dm)day=+dm[1];else if(/pertengahan/.test(t))day=12;else if(/akhir/.test(t))day=22;else if(/awal/.test(t))day=3;
    let y=TODAY.getFullYear();const cand=new Date(y,mi,day);if(cand<=TODAY)y++;
    out.start=iso(new Date(y,mi,day));
  }
  const days=/seminggu/.test(t)?[0,"7"]:t.match(/(\d+)\s*hari/),nights=t.match(/(\d+)\s*malam/);
  if(out.start&&(nights||days)){const n=nights?+nights[1]:+days[1]-1;out.end=iso(addDays(parseISO(out.start),n))}
  let adults=null;for(const w in NUMW)if(t.includes(" "+w+" "))adults=NUMW[w];
  const po=t.match(/(\d+)\s*(?:orang|org|dewasa)/);if(po)adults=+po[1];
  if(adults)out.adults=adults;
  const ch=t.match(/(\d+)\s*anak/);if(ch){out.children=+ch[1];if(out.adults&&/(\d+)\s*orang/.test(t)&&!/dewasa/.test(t))out.adults=Math.max(1,out.adults-out.children)}
  const bb=t.match(/(\d+)\s*bayi/);if(bb)out.infants=+bb[1];
  const bm=t.match(/(\d+(?:[.,]\d+)?)\s*(juta|jt)\b/)||t.match(/(\d+(?:[.,]\d+)?)\s*(rb|ribu|k)\b/)||t.match(/rp\s?([\d.]+)/);
  if(bm){let v=parseFloat(bm[1].replace(/\./g,bm[2]?"":"").replace(",","."));if(bm[2]==="juta"||bm[2]==="jt")v*=1e6;else if(bm[2])v*=1e3;out.budget=Math.round(v)}
  for(const k in out)filled.push(k);
  return{out,filled};
}

function makeSuggestions(){

  let best=null;for(let d=1;d<=21;d++){const q={...p,start:iso(addDays(parseISO(p.start),d)),end:iso(addDays(parseISO(p.end),d))};const r=search(q);const sv=base.total-r.cheapest.total;if(!best||r.cheapest.total<best.total)best={q,total:r.cheapest.total,sv,ok:r.ok,d};if(r.ok){best={q,total:r.cheapest.total,sv,ok:true,d};break}}
  if(best&&best.sv>0)out.push({title:"Geser tanggal",desc:`Berangkat ${fmtD(parseISO(best.q.start))}, pulang ${fmtD(parseISO(best.q.end))}. Lebih murah ${rp(best.sv)}.`,fits:best.ok,total:best.total,apply:{start:best.q.start,end:best.q.end}});

  return out;
}

let toastT;
function toast(m){S.toast=m;render();clearTimeout(toastT);toastT=setTimeout(()=>{S.toast=null;render()},2200)}
function runSearch(){
  S.errs=validForm();if(Object.keys(S.errs).length){render();return}
  S.screen="loading";S.sheet=null;S.ldDone=0;render();[1,2,3].forEach(k=>setTimeout(()=>{S.ldDone=k;const el=document.querySelectorAll(".load .ld-steps div")[k-1];if(el)el.classList.add("ok")},k*330));
  setTimeout(()=>{
    const p=P();let r=search(p,S.opt);
    if(S.demo.trainDown&&r.ok){const q=search(p,S.opt);q.flights=q.flights.filter(f=>f.mode!=="kereta");const r2=searchNoTrain(p);r=r2;r.partial=true}
    if(r.noroute){S.screen="home";S.errs={dest:"Belum ada transportasi untuk rute ini. Coba kota lain."};render();return}
    S.res=r;
    if(r.ok){S.pkgs=r.pkgs;S.screen="results"}else{S.res.sug=makeSuggestions();S.screen="short"}
    render();window.scrollTo(0,0);
  },1100);
}
function scenario(s,extra){S.form=blankForm();S.filled=[];S.opt={};S.errs={};S.sentence=s;const{out,filled}=parseSentence(s);Object.assign(S.form,out);S.filled=filled;if(extra)Object.assign(S.form,extra);S.screen="home";S.demo.open=false;render();}
function startPax(){S.pax=paxList().map(x=>({...x,name:"",dob:"",email:""}));if(S.user)S.pax[0].email=S.user.email;S.paxErr={}}
function validPax(){
  const p=P(),e={};let ok=true;
  S.pax.forEach((x,i)=>{const m={};
    if(!/^[A-Za-z][A-Za-z' .-]{1,}\s+[A-Za-z][A-Za-z' .-]*$/.test(x.name.trim()))m.name="Tulis nama depan dan belakang, hanya huruf.";
    if(x.type!=="dewasa"){if(!x.dob)m.dob="Isi tanggal lahir.";else{const a=ageAt(parseISO(x.dob),parseISO(p.start));
      if(x.type==="anak"&&a>=12)m.dob=`Berumur ${a} tahun saat berangkat. Harus dipesan sebagai dewasa; ubah jumlah orang di pencarian.`;
      else if(x.type==="anak"&&a<2)m.dob="Di bawah 2 tahun saat berangkat. Pesan sebagai bayi.";
      else if(x.type==="bayi"&&a>=2)m.dob="Sudah 2 tahun saat berangkat. Pesan sebagai anak.";}}
    if(i===0&&!/^\S+@\S+\.\S+$/.test(x.email||""))m.email="Isi email yang valid.";
    if(Object.keys(m).length){e[i]=m;ok=false}});
  S.paxErr=e;return ok;
}
function doRecheck(){S.recheck={loading:true};S.screen="review";render();setTimeout(()=>{const p=P();S.recheck={loading:false,changed:S.demo.price,delta:S.demo.price?10000*nightsOf(p.start,p.end)*roomsFor(p):0,agreed:false};render()},1000)}
function recordOrder(status,hotel,total){const p=P(),who=[p.adults+" dewasa",p.children?p.children+" anak":"",p.infants?p.infants+" bayi":""].filter(Boolean).join(", ");S.orders=S.orders.filter(o=>o.code!==S.code);const ch=S.chosen,f=ch.f,hh=hotel?(S.res.hotels.find(x=>x.name===hotel)||ch.h):null;
  const tk=buildTk({code:S.code,paket:ch.band.name,origin:p.origin,dest:p.dest,mode:f.mode,carrier:f.carrier,cls:f.cls,dep:f.dep,ret:f.ret,dur:f.dur,start:p.start,end:p.end,
    pax:S.pax.map(x=>({name:x.name,type:x.type,seatOnReturn:x.type==="bayi"&&x.dob&&ageAt(parseISO(x.dob),parseISO(p.end))>=2})),hotel:hh?{name:hh.name,type:hh.type,area:hh.area,stars:hh.stars,rating:hh.rating,cancel:hh.cancel}:null,total,budget:p.budget});
  S.orders.unshift({code:S.code,origin:p.origin,dest:p.dest,start:p.start,end:p.end,pax:who,paket:ch.band.name,carrier:f.carrier,hotel,total,status,budget:p.budget,tk})}
function code(){const r=rng(String(Date.now()));return "BT"+Array.from({length:6},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(r()*32)]).join("")}
function doPay(){
  const r=S.recheck;S.paidTotal=pkgTotals(S.chosen).total+paxNotes().reduce((a,b)=>a+b.extra,0)+(r.changed?r.delta:0);S.code=code();
  const f=S.chosen.f;
  S.proc=[{label:"Pembayaran diterima",sub:"Satu kali bayar "+rp(S.paidTotal),ic:"card",st:"run"},{label:"Memesan tiket",sub:f.carrier,ic:f.mode==="kereta"?"train":"plane",st:""},{label:"Memesan kamar",sub:S.chosen.h.name,ic:"bed",st:""},{label:"Menerbitkan dokumen",sub:"E-tiket dan voucher",ic:"doc",st:""}];
  S.screen="process";S.procPct=0;render();
  const set=()=>{document.querySelectorAll(".pz-step").forEach((el,i)=>{el.className="pz-step "+S.proc[i].st});
    const tgt=Math.round(S.proc.filter(x=>x.st==="ok").length/S.proc.length*100),el=document.getElementById("pz-pct"),bar=document.getElementById("pz-bar");
    if(bar)bar.style.width=tgt+"%";if(el){const from=S.procPct,t0=performance.now();const st=t=>{const k=Math.min(1,(t-t0)/600);el.textContent=Math.round(from+(tgt-from)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(st)};requestAnimationFrame(st)}S.procPct=tgt;
    const cur=S.proc.find(x=>x.st==="run"),lb=document.getElementById("pz-now");if(lb)lb.textContent=cur?cur.label+"…":"Semua selesai";};
  let k=0;const tick=()=>{
    if(S.screen!=="process")return;
    if(k===2&&S.demo.hotelFail){S.proc[k].st="no";set();setTimeout(()=>{S.screen="fail";render()},1100);return}
    S.proc[k].st="ok";k++;
    if(k<S.proc.length){S.proc[k].st="run";set();setTimeout(tick,1150)}
    else{set();const ov=document.querySelector(".pz");if(ov)ov.classList.add("done");setTimeout(()=>{S.trip={code:S.code,hotel:S.chosen.h};recordOrder("up",S.chosen.h.name,S.paidTotal);S.screen="trip";render();window.scrollTo(0,0)},1700)}
  };setTimeout(tick,1150);
}

function applySug(s){
  const a=s.apply;S.opt={};
  if(a.end)S.form.end=a.end;if(a.start)S.form.start=a.start;if(a.budget)S.form.budget=a.budget;
  if(a.darat){S.opt={darat:true,note:"Jalur darat dan laut ikut dicari. Perjalanan lebih lama, tapi lebih hemat."}}
  runSearch();
}

      S.pax.forEach(x=>{if(x.type==="dewasa")x.name=names[a2++%names.length];else if(x.type==="anak"){x.name=kid[c2++%kid.length];x.dob=iso(addDays(ps,-365*7))}else{x.name=baby[b2++%1];x.dob=iso(addDays(ps,-700))}});S.pax[0].email=S.user?S.user.email:"rina.kartika@email.com";S.paxErr={};render();break}

    case"demotog":S.demo.open=!S.demo.open;render();break;

let heroRun=0,heroActive=false;
function heroStatic(ex,pi){
  const q=document.getElementById("rq-t");if(!q)return;
  q.textContent=ex.s;ex.chips.forEach((c,i)=>{const el=document.getElementById("rc"+i);if(el){el.classList.add("on");el.innerHTML=c[0]+"<b>"+c[1]+"</b>"}});
  heroPkg(ex,pi,true);
}
function heroPkg(ex,pi,instant){
  const [f,h]=ex.p[pi],sisa=ex.budget-f-h;
  document.querySelectorAll(".rtabs span").forEach((s,i)=>s.classList.toggle("on",i===pi));
  const bf=document.getElementById("rb-f"),bh=document.getElementById("rb-h");if(!bf)return;
  bf.style.width=(f/ex.budget*100)+"%";bh.style.width=(h/ex.budget*100)+"%";
  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=rp(Math.round(v/1000)*1000)};
  if(instant){set("rv-f",f);set("rv-h",h);set("rv-s",sisa);return}
  const t0=performance.now(),from=+(document.getElementById("rv-s")?.dataset.v||ex.budget);
  const step=t=>{const k=Math.min(1,(t-t0)/650),e=1-Math.pow(1-k,3);set("rv-f",f*e);set("rv-h",h*e);set("rv-s",from+(sisa-from)*e);if(k<1&&S.route==="beranda")requestAnimationFrame(step)};
  requestAnimationFrame(step);const s=document.getElementById("rv-s");if(s)s.dataset.v=sisa;
}
function startHero(){
  if(RM()){heroStatic(HERO_EX[0],1);return}
  if(heroActive)return;heroActive=true;const my=++heroRun;
  const wait=ms=>new Promise(r=>setTimeout(r,ms)),alive=()=>my===heroRun&&S.route==="beranda"&&document.getElementById("rcpt");
  (async()=>{let n=0;
    while(alive()){
      if(n===0)await wait(2400);if(!alive())return;const ex=HERO_EX[n%HERO_EX.length];n++;
      const q=document.getElementById("rq-t");q.textContent="";
      for(let i=0;i<5;i++){const c=document.getElementById("rc"+i);c.classList.remove("on");c.textContent=ex.chips[i][0]}
      document.querySelectorAll(".rtabs span").forEach(s=>s.classList.remove("on"));
      document.getElementById("rb-f").style.width="0";document.getElementById("rb-h").style.width="0";
      ["rv-f","rv-h"].forEach(id=>document.getElementById(id).textContent="Rp0");const sv=document.getElementById("rv-s");sv.textContent=rp(ex.budget);sv.dataset.v=ex.budget;
      await wait(500);
      for(const ch of ex.s){if(!alive())return;document.getElementById("rq-t").textContent+=ch;await wait(ch===" "?55:32)}
      await wait(350);
      for(let i=0;i<5;i++){if(!alive())return;const c=document.getElementById("rc"+i);c.classList.add("on");c.innerHTML=ex.chips[i][0]+"<b>"+ex.chips[i][1]+"</b>";await wait(190)}
      for(let pi=0;pi<3;pi++){await wait(pi?1500:450);if(!alive())return;heroPkg(ex,pi)}
      await wait(2600);
    }})().finally(()=>{heroActive=false});
}

  ${pax.map((p,k)=>`<tr><td><b>${esc(p.name)}</b></td><td>${p.type[0].toUpperCase()+p.type.slice(1)}</td><td>${p.type==="bayi"&&!(kind==="ret"&&p.seatOnReturn)?"Dipangku":p.seat}</td><td class="n tk-code">${(plane?"126":"KA")}${String(Math.floor(seatR()*1e10)).padStart(10,"0").slice(0,10)}</td></tr>`).join("")}</table>
  <div class="tk-two"><div class="tk-box"><b class="t">Yang perlu dibawa</b><ul><li>KTP, paspor, atau kartu identitas lain yang namanya sama dengan tiket. Anak cukup akta lahir atau KIA.</li><li>E-tiket ini, di ponsel atau dicetak.</li></ul></div>
  <div class="tk-box warn"><b class="t">Jangan sampai terlambat</b><ul><li>${plane?`Tiba di bandara paling lambat <b>${hhmm(leg.dep-1.5)}</b> (90 menit sebelum berangkat).`:`Tiba di stasiun paling lambat <b>${hhmm(leg.dep-.5)}</b>.`}</li><li>${plane?"Konter check-in tutup 45 menit sebelum berangkat.":"Pintu peron ditutup 5 menit sebelum berangkat."}</li></ul></div></div>
  ${tkBudget(d)}${tkFooter(i,n)}</section>`;
}
function hotelPage(d,i,n){
  const h=d.hotel;
  return `<section class="tk">${d.sample?'<span class="tk-sample">Dokumen contoh dari prototype Budget Trip. Data, kode QR, dan nomor tiket tidak asli.</span>':""}${tkHeader("hotel",d)}
  <div class="tk-hotel"><div class="top"><div><span class="stars">${"★".repeat(h.stars)}</span><b>${esc(h.name)}</b><small>${esc(h.type)} · ${esc(h.area)}, ${esc(d.to.city)}</small></div><div style="text-align:right"><small>Ulasan tamu</small><b style="font-size:26px">${h.rating.toFixed(1)}</b></div></div>
    <div class="ci"><div><small>Check-in</small><b>${fmtDL(d.out.date)}</b><span>mulai 14.00</span></div><div class="nt"><b>${d.nights}</b><span>malam</span></div><div><small>Check-out</small><b>${fmtDL(d.ret.date)}</b><span>paling lambat 12.00</span></div><div style="text-align:center">${qrSVG(d.code+"h",86)}</div></div></div>
  <h3>Kamar dan tamu</h3>
  <table><tr><th>Kamar</th><th>Tamu</th><th>Termasuk</th></tr>
  ${d.rooms.map((r,k)=>`<tr><td><b>Kamar ${k+1}</b><br><span style="color:var(--mu)">${h.stars>=4?"Deluxe":h.stars===3?"Superior":"Standar"}, ${r.length>2?"1 tempat tidur besar + ekstra":"1 tempat tidur besar"}</span></td><td>${r.map(p=>esc(p.name)+(p.type!=="dewasa"?` <span style="color:var(--mu)">(${p.type})</span>`:"")).join("<br>")}</td><td>${h.stars>=3?"Sarapan untuk 2 orang, Wi-Fi":"Wi-Fi"}</td></tr>`).join("")}</table>
  <div class="tk-two"><div class="tk-box"><b class="t">Saat check-in</b><ul><li>Sebutkan kode pesanan <b class="tk-code">${d.code}</b> atau tunjukkan kode QR.</li><li>Bawa KTP atas nama ${esc(d.pax[0].name)}.</li><li>Hotel bisa meminta deposit, dikembalikan saat check-out.</li></ul></div>
  <div class="tk-box ${h.cancel?"":"warn"}"><b class="t">Pembatalan</b><ul>${h.cancel?`<li>Gratis sampai <b>${fmtDL(addDays(d.out.date,-2))}</b>, pukul 23.59.</li><li>Setelah itu dikenakan biaya 1 malam.</li>`:`<li>Kamar ini tidak bisa dibatalkan atau diubah.</li><li>Kalau tidak datang, biaya tidak dikembalikan.</li>`}</ul></div></div>
  ${tkBudget(d)}${tkFooter(i,n)}</section>`;
}
function tkBudget(d){if(!d.budget)return"";const used=Math.min(100,d.total/d.budget*100);return `<div class="tk-bud"><span>Tiket + hotel ${rp(d.total)} dari anggaran ${rp(d.budget)}</span><div class="bar"><i style="width:${used}%"></i></div><span>Sisa <b>${rp(d.budget-d.total)}</b></span></div>`}
function durTxt(h){const m=Math.round(h*60);return (m>=60?Math.floor(m/60)+" j ":"")+(m%60?m%60+" m":"")}
/* data dari pesanan */
function ticketData(o){
  if(o.tk)return o.tk;
  const r=rng("tk"+o.code),mode=/KA|Kereta/.test(o.carrier)?"kereta":"pesawat",fake={pesawat:{dep:pick(r,[6.5,9.25,13.5,16.75]),dur:.9+distKm(CITIES[o.origin],CITIES[o.dest])/700},kereta:{dep:pick(r,[6,9.5,14]),dur:distKm(CITIES[o.origin],CITIES[o.dest])*1.4/75}}[mode];
  const ret=pick(r,[10.25,14.5,17.75]),adults=+(o.pax.match(/(\d+) dewasa/)||[0,1])[1],kids=+(o.pax.match(/(\d+) anak/)||[0,0])[1];
  const names=[...S.travelers.map(t=>t.name),"Ayu Lestari","Dimas Pratama"],pax=[];for(let i=0;i<adults;i++)pax.push({name:names[i],type:"dewasa"});for(let i=0;i<kids;i++)pax.push({name:["Nadia Putri","Raka Aditya"][i],type:"anak"});
  return buildTk({code:o.code,paket:o.paket,origin:o.origin,dest:o.dest,mode,carrier:o.carrier,cls:/Nusa|Samudra/.test(o.carrier)?"full":/Eksekutif|Whoosh/.test(o.carrier)?"eks":"lcc",dep:fake.dep,ret,dur:fake.dur,start:o.start,end:o.end,pax,
    hotel:o.hotel?{name:o.hotel,type:/Resort/.test(o.hotel)?"Hotel bintang 4":/^(Griya|Pondok|Wisma|Rumah)/.test(o.hotel)?"Guesthouse":"Hotel bintang 3",area:o.hotel.split(" ").slice(-1)[0],stars:/Resort/.test(o.hotel)?4:/^(Griya|Pondok|Wisma|Rumah)/.test(o.hotel)?2:3,rating:8.6,cancel:true}:null,total:o.total,budget:o.budget||0});
}
function buildTk(x){
  const d={code:x.code,paket:x.paket,mode:x.mode,carrier:x.carrier,cls:x.cls,dur:x.dur,clsLabel:{lcc:"Ekonomi",full:"Ekonomi layanan penuh",eko:"Kelas ekonomi",eks:"Kelas eksekutif",whoosh:"Kelas premium ekonomi",darat:"Bus + kapal"}[x.cls]||"Ekonomi",
    from:placeOf(x.origin,x.mode),to:placeOf(x.dest,x.mode),out:{date:parseISO(x.start),dep:x.dep,arr:x.dep+x.dur},ret:{date:parseISO(x.end),dep:x.ret,arr:x.ret+x.dur},
    pax:x.pax,hotel:x.hotel,nights:nightsOf(x.start,x.end),total:x.total,budget:x.budget,sample:x.sample};
  const guests=x.pax.filter(p=>p.type==="dewasa").concat(x.pax.filter(p=>p.type==="anak")),k=Math.max(1,Math.ceil(guests.length/2));d.rooms=Array.from({length:k},()=>[]);guests.forEach((g,i)=>d.rooms[i%k].push(g));
  x.pax.filter(p=>p.type==="bayi").forEach(b=>d.rooms[0].push(b));
  return d;
}

S.tkView=null;
function vTicket(){
  const v=S.tkView,o=S.orders.find(x=>x.code===v.code);if(!o)return"";const d=ticketData(o),kinds=[["out","E-tiket pergi"],["ret","E-tiket pulang"]].concat(d.hotel?[["hotel","Voucher hotel"]]:[]);
  const vw=Math.min(window.innerWidth,1400)-32,sc=Math.min(1,vw/794);
  return `<div class="tkov" role="dialog" aria-modal="true" aria-label="${kinds.find(k=>k[0]===v.kind)[1]}">
    <div class="tkbar"><div class="seg" role="group" aria-label="Dokumen">${kinds.map(([k,l])=>`<button data-a="tkkind" data-v="${k}" aria-pressed="${v.kind===k}">${l}</button>`).join("")}</div>
      <button class="btn ghost sm" data-a="tkcopy" data-v="${o.code}">Salin kode ${o.code}</button><button class="btn sm" data-a="tkclose">Tutup</button></div>
    <div class="tkscroll" data-a="tkbg"><div style="width:${794*sc}px;height:${1123*sc}px;flex:none"><div class="tkfit" style="--s:${sc};transform:scale(${sc});width:794px">${ticketPage(v.kind,d,kinds.findIndex(k=>k[0]===v.kind)+1,kinds.length)}</div></div></div>
    <p class="small" style="margin:0;padding:8px 16px;background:var(--card);color:var(--muted);text-align:center">Versi PDF dokumen ini dikirim ke email pemesan bersama berkas kalender.</p></div>`;
}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a;
  if(a==="tkopen"){S.tkView={code:el.dataset.c,kind:el.dataset.v};render()}
  if(a==="tkkind"){S.tkView.kind=el.dataset.v;render()}
  if(a==="tkclose"||(a==="tkbg"&&e.target===el)){S.tkView=null;render()}
  if(a==="tkcopy"){try{navigator.clipboard.writeText(el.dataset.v).then(()=>toast("Kode pesanan disalin"),()=>toast("Kode pesanan: "+el.dataset.v))}catch(_){toast("Kode pesanan: "+el.dataset.v)}}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.tkView){S.tkView=null;render()}});
window.addEventListener("resize",()=>{if(S.tkView)render()});

S.umenu=false;

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");
  if(el&&el.dataset.a==="umenu"){S.umenu=!S.umenu;render();return}
  if(S.umenu&&!e.target.closest(".umenu")){S.umenu=false;render()}
  else if(S.umenu&&e.target.closest(".umenu a,.umenu [data-a=logout]")){S.umenu=false}
},true);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.umenu){S.umenu=false;render()}});

function sizeArc(){const box=document.querySelector(".pz-arc"),svg=document.getElementById("pz-svg");if(!box||!svg)return;
  const w=box.clientWidth,h=box.clientHeight,y=h-12,d=`M10 ${y} Q ${w/2} ${-h*.55} ${w-10} ${y}`;
  svg.setAttribute("viewBox",`0 0 ${w} ${h}`);svg.querySelectorAll("path").forEach(p=>p.setAttribute("d",d));
  const c=svg.querySelectorAll("circle");c[0].setAttribute("cx",10);c[0].setAttribute("cy",y);c[1].setAttribute("cx",w-10);c[1].setAttribute("cy",y);
  const pl=box.querySelector(".pz-plane");if(pl)pl.style.setProperty("--op",`path("${d}")`);}
window.addEventListener("resize",()=>{if(S.screen==="process")sizeArc()});
